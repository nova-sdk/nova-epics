[project]
name = "nova-epics"
version = "0.5.0"
description = "A Python Package for retrieving unprivileged instrument status information from EPICS for use in NOVA applications."
authors = [
    { name = "John Duggan", email = "dugganjw@ornl.gov" }
]
readme = "README.md"
license = "MIT"
keywords = ["NDIP", "Python", "Trame"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "dpath",
    "tomli",
    "xmltodict"
]

[project.optional-dependencies]
trame = ["nova-trame"]

[project.urls]
Changelog = "https://github.com/nova-sdk/nova-epics/blob/main/CHANGELOG.md"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64"]

[tool.pixi.environments]
default = {features = ["dev"], solve-group = "default"}
production = {features = [], solve-group = "default"}

[tool.pixi.dependencies]

[tool.pixi.pypi-dependencies]
nova-epics = { path = ".", editable = true }
hatch = "*"

[tool.pixi.feature.dev.pypi-dependencies]
mypy = ">=1.10.0,<2"
pre-commit = ">=2.20.0,<3"
coverage = ">=6.4.3,<7"
pytest = "*"
pytest_asyncio = "*"
ruff = "==0.6.2"
selenium = "*"
altair = ">=5.3.0,<6"
vega-datasets = ">=0.9.0,<1"
requests = ">=2.32.4,<3"
sphinx = "*"
sphinx-rtd-theme = ">=3.0.2,<4"
sphinxcontrib-napoleon ="*"
nova-trame = "*"

[tool.pixi.tasks]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
norecursedirs = [".git", "tmp*", "_tmp*", "__pycache__"]

[tool.ruff]
exclude = [".pixi"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",  # PEP8 naming convetions
    "D"  # pydocstyle
]
ignore = [
    "C901",  # too complex
    "D102", # Missing docstring in public function
    "D103", # Missing docstring in public method
    "D401"  # imperative mood

]

[tool.ruff.lint.extend-per-file-ignores]
'__init__.py' = ['D104'] # Missing docstring in public package

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
ignore_missing_imports = false
check_untyped_defs = true
disallow_untyped_defs = true
ignore_errors = false
disable_error_code = ["import-untyped"]
# You can exclude files with the following (ONLY WHEN NECESSARY)
# exclude = ["path/to/file"]

[tool.coverage.report]
omit = [
    '*__init__*', # __init__ files should just re-export other classes and functions
]

[tool.coverage.run]
command_line = "-m pytest --junit-xml=reports/junit.xml"
data_file = "reports/.coverage"
